name: publish

# Builds and uploads to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (no token in secrets): register this repo and
# workflow name under the project's "Publishing" settings on pypi.org once.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish
